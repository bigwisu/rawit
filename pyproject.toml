[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rawit"
version = "0.1.0"
description = "Non-autoregressive System 1 decision engine for Bahasa Indonesia & Bahasa Melayu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Wisu Suntoyo" }
]
keywords = [
    "decision-model", "system-one", "bahasa-indonesia", "bahasa-melayu",
    "sea-lion", "calibration", "rlcd", "routing", "triage", "southeast-asia",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[tool.setuptools]
packages = ["rawit", "rawit.server", "rawit.training", "rawit.export"]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]
onnx = [
    "onnx",
    "onnxruntime",
    "onnxscript",
]
train = [
    "scipy>=1.10.0",
    "datasets>=2.14.0",
    "accelerate>=0.27.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
rawit-serve = "rawit.server.app:main"

[project.urls]
Homepage = "https://github.com/bigwisu/rawit"
